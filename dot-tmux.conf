# ── Prefix Key ──────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General Settings ─────────────────────
set -g mouse on
set-window-option -g mode-keys vi
setw -g mode-keys vi
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g mode-keys vi

# Bind vi-style copy (add to .tmux.conf)
#bind-key -T copy-mode-vi v send-keys -X begin-selection
#bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
#bind-key -T copy-mode-vi Escape send-keys -X cancel

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ── Terminal Colors ──────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -ga terminal-overrides ",*:Tc"

# ── Status Bar ────────────────────────────

run "~/private/Vira-Theme-Carbon.tmux"

set -g status-position top
set -g status-interval 5
set -g status-left-length 100
set -g status-left "#{?client_prefix,#[fg=#{@vira_yellow}] 󱐋 #[default],}"
set -g status-right "#[fg=#{@vira_accent},bg=#{@vira_bg},bold]#[bg=#{@vira_accent},fg=#{@vira_black}] #S %H:%M %d-%b #[fg=#{@vira_accent},bg=#{@vira_bg}]"
set -g window-status-current-format "#[fg=#{@vira_accent},bg=#{@vira_bg},bold]#[default]#I:#W#F#[fg=#{@vira_accent},bg=#{@vira_bg}]"
set -g status-justify left

bind r source-file ~/.tmux.conf \; display "Config reloaded!"

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'
