# Sheldon configuration file (~/.config/sheldon/plugins.toml)
# Documentation: https://sheldon.mmotm.ca/

shell = "zsh"

# Autocomplete plugin
[plugins.zsh-autocomplete]
github = "marlonrichert/zsh-autocomplete"

# Fish-like autosuggestions as you type
[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
use = ["{{ name }}.zsh"]

# PNPM shell completion
[plugins.pnpm-shell-completion]
github = "g-plane/pnpm-shell-completion"

# Useful Oh-My-Zsh plugins loaded directly from GitHub without Oh-My-Zsh framework
[plugins.omz-git]
github = "ohmyzsh/ohmyzsh"
dir = "plugins/git"

[plugins.omz-aws]
github = "ohmyzsh/ohmyzsh"
dir = "plugins/aws"

[plugins.omz-fzf]
github = "ohmyzsh/ohmyzsh"
dir = "plugins/fzf"

# Fast syntax highlighting (must be loaded last)
[plugins.fast-syntax-highlighting]
github = "zdharma-continuum/fast-syntax-highlighting"
